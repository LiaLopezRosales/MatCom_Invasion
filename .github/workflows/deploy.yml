# MatCom Invasion — CI + deploy GitHub Pages
#
# push a `main`  → test + build + deploy a GitHub Pages
# PR (cualquier) → test + build (sin deploy)
#
# Si `make test` falla → se detiene el pipeline (no se buildea ni deploya).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Setup Emscripten (cached)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "6.0.9"

      # Criterion (used by `make test`) is not preinstalled on Ubuntu runners.
      - name: Install Criterion test framework
        run: sudo apt-get update && sudo apt-get install -y libcriterion-dev

      - name: Build native engine
        run: make native

      - name: Run C tests (ASan/UBSan)
        run: make test

      - name: Gate coverage (>= 90%)
        run: make coverage-gate

      - name: Build WASM module
        run: make wasm

      - name: Install frontend deps
        working-directory: web
        run: npm install

      - name: Build frontend (Vite)
        working-directory: web
        run: npm run build

      # Only deploy the production build when pushing to `main`.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
